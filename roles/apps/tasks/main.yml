---
# Tasks for 'apps' role

# --- DNF Software Installation ---
- name: Software | Install KDE specific DNF packages
  ansible.builtin.dnf:
    name: "{{ dnf_packages_kde }}"
    state: present
  when: is_kde
  tags: [software, dnf, kde]

- name: Software | Install GNOME specific DNF packages
  ansible.builtin.dnf:
    name: "{{ dnf_packages_gnome }}"
    state: present
  when: is_gnome
  tags: [software, dnf, gnome]

# Secure Boot: VirtualBox (RPM Fusion) builds its modules with akmods, so the signing key must
# exist BEFORE the package install (shared with the nvidia role; a no-op if it already ran).
- name: VirtualBox | Prepare module signing key (Secure Boot)
  ansible.builtin.import_role:
    name: akmods_mok
  when:
    - is_secure_boot
    - "'VirtualBox' in dnf_packages_common"
  tags: [software, dnf, common, virtualbox, secureboot]

- name: Software | Install DNF packages
  ansible.builtin.dnf:
    name: "{{ dnf_packages_common }}"
    state: present
  tags: [software, dnf, common]

- name: ClamAV | Enable and start freshclam service
  ansible.builtin.systemd:
    name: clamav-freshclam.service
    enabled: yes
    state: started
  tags: [software, clamav]

# --- VirtualBox Configuration ---
- name: VirtualBox | Ensure vboxusers and vboxsf groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - vboxusers
    - vboxsf
  tags: [software, virtualbox]

- name: VirtualBox | Add user to vboxusers and vboxsf groups
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: 
      - vboxusers
      - vboxsf
    append: yes
  when: user_name != 'root'
  tags: [software, virtualbox]

- name: Software | Install KDE specific flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    remote: flathub
  loop: "{{ flatpak_apps_kde }}"
  when: is_kde
  tags: [software, flatpak, kde]

- name: Software | Install GNOME specific flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    remote: flathub
  loop: "{{ flatpak_apps_gnome }}"
  when: is_gnome
  tags: [software, flatpak, gnome]

- name: Software | Install flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    remote: flathub
  loop: "{{ flatpak_apps_common }}"
  tags: [software, flatpak, common]

# --- Brave Installation ---
- name: Brave | Add Brave repository
  ansible.builtin.yum_repository:
    name: brave-browser
    description: Brave Browser
    baseurl: "{{ brave_repo_url }}"
    enabled: yes
    gpgcheck: yes
    gpgkey: "{{ brave_gpg_key }}"
  tags: [software, brave]

- name: Brave | Install Brave
  ansible.builtin.dnf:
    name: "{{ brave_packages }}"
    #name: brave-browser
    state: present
  tags: [software, brave]

# --- Visual Studio Code Installation ---
- name: VSCode | Add Visual Studio Code repository
  ansible.builtin.yum_repository:
    name: code
    description: Visual Studio Code
    baseurl: "{{ vscode_repo_url }}"
    enabled: yes
    gpgcheck: yes
    gpgkey: "{{ vscode_gpg_key }}"
  tags: [software, vscode]

- name: VSCode | Install Visual Studio Code
  ansible.builtin.dnf:
    name: code
    state: present
  tags: [software, vscode]

# --- GitHub CLI Installation ---
- name: GitHub CLI | Add GitHub CLI repository
  ansible.builtin.yum_repository:
    name: gh-cli
    description: packages for the GitHub CLI
    baseurl: "{{ gh_repo_url }}"
    enabled: yes
    gpgcheck: yes
    gpgkey: "{{ gh_gpg_key }}"
  tags: [software, gh]

- name: GitHub CLI | Install GitHub CLI
  ansible.builtin.dnf:
    name: gh
    state: present
  tags: [software, gh]

# --- Shortcuts & Overrides ---
- name: Shortcuts | Ensure local applications directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/applications"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'
  when: user_name != 'root'
  tags: [software, shortcuts, antigravity]

- name: Shortcuts | Create local override for Steam shortcut
  ansible.builtin.copy:
    src: /usr/share/applications/steam.desktop
    dest: "{{ user_home }}/.local/share/applications/steam.desktop"
    remote_src: yes
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
    force: no
  when: user_name != 'root'
  tags: [software, steam, gpu]

- name: Shortcuts | Update Exec line to use NVIDIA GPU
  ansible.builtin.replace:
    path: "{{ user_home }}/.local/share/applications/steam.desktop"
    regexp: '^Exec=/usr/bin/steam\s+(.*)$'
    replace: 'Exec=env __NV_PRIME_RENDER_OFFLOAD=1 __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 __GLX_VENDOR_LIBRARY_NAME=nvidia /usr/bin/steam \1'
  when: user_name != 'root'
  tags: [software, steam, gpu]

# --- Antigravity IDE ---
# Official AppImage. The update manifest is the one the app itself polls (electron-updater, channel
# latest-x64 on Linux); its sha512 is base64, get_url wants hex. Only downloaded when missing: once
# installed, the app replaces its own AppImage on updates, so the playbook never fights it.
- name: Antigravity IDE | Install FUSE 2 (needed to run AppImages)
  ansible.builtin.dnf:
    name: fuse-libs
    state: present
  when: antigravity_ide_install | bool
  tags: [software, antigravity]

- name: Antigravity IDE | Check for the AppImage
  ansible.builtin.stat:
    path: "{{ antigravity_ide_dir }}/antigravity"
  register: antigravity_ide_bin
  check_mode: false
  when: user_name != 'root'
  tags: [software, shortcuts, antigravity]

- name: Antigravity IDE | Download the latest release
  when:
    - antigravity_ide_install | bool
    - user_name != 'root'
    - not (antigravity_ide_bin.stat.exists | default(true))
  tags: [software, antigravity]
  block:
    - name: Antigravity IDE | Read the update manifest
      ansible.builtin.uri:
        url: "{{ antigravity_ide_manifest_url }}"
        return_content: true
      register: antigravity_ide_manifest
      check_mode: false

    - name: Antigravity IDE | Pick the AppImage from the manifest
      ansible.builtin.set_fact:
        antigravity_ide_release: >-
          {{ (antigravity_ide_manifest.content | from_yaml).files
             | selectattr('url', 'search', '[.]AppImage$') | first }}

    - name: Antigravity IDE | Convert the checksum to hex
      ansible.builtin.command:
        argv: [python3, -c, "import base64, sys; print(base64.b64decode(sys.argv[1]).hex())",
               "{{ antigravity_ide_release.sha512 }}"]
      register: antigravity_ide_sha512
      changed_when: false
      check_mode: false

    - name: Antigravity IDE | Ensure the install directory exists
      ansible.builtin.file:
        path: "{{ antigravity_ide_dir }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'
      register: antigravity_ide_dir_created

    # In --check the directory above is only reported, not created, and get_url would fail on it.
    - name: Antigravity IDE | Download the AppImage
      ansible.builtin.get_url:
        url: "{{ antigravity_ide_release.url }}"
        dest: "{{ antigravity_ide_dir }}/antigravity"
        checksum: "sha512:{{ antigravity_ide_sha512.stdout }}"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: '0755'
      register: antigravity_ide_download
      when: not (ansible_check_mode and antigravity_ide_dir_created is changed)

# The icon comes from inside the AppImage (--appimage-extract needs no FUSE). The antigravity.png
# at its root is only a symlink, so extract the real file. Naming the entry
# antigravity.desktop lets the dock match the window (Wayland app_id 'antigravity') to it; the
# MimeType lets the browser hand the login callback (antigravity://) back to the app.
# Each level of the icon path is owned by the user: something run as root with the user's HOME can
# leave ~/.local/share/icons/hicolor owned by root, and the extract below runs as the user.
- name: Antigravity IDE | Ensure the icon directories belong to the user
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/icons/{{ item }}"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'
  loop: [hicolor, hicolor/512x512, hicolor/512x512/apps]
  when: user_name != 'root' and (antigravity_ide_bin.stat.exists | default(false) or antigravity_ide_download | default({}) is changed)
  tags: [software, shortcuts, antigravity]

- name: Antigravity IDE | Extract the icon
  ansible.builtin.shell:
    cmd: |
      set -e
      tmp=$(mktemp -d)
      trap 'rm -rf "$tmp"' EXIT
      cd "$tmp"
      {{ (antigravity_ide_dir ~ '/antigravity') | quote }} --appimage-extract {{ icon_in_appimage }} >/dev/null
      install -D -m 0644 squashfs-root/{{ icon_in_appimage }} {{ antigravity_ide_icon | quote }}
    creates: "{{ antigravity_ide_icon }}"
  become_user: "{{ user_name }}"
  vars:
    antigravity_ide_icon: "{{ user_home }}/.local/share/icons/hicolor/512x512/apps/antigravity.png"
    icon_in_appimage: usr/share/icons/hicolor/512x512/apps/antigravity.png
  when: user_name != 'root' and (antigravity_ide_bin.stat.exists | default(false) or antigravity_ide_download | default({}) is changed)
  tags: [software, shortcuts, antigravity]

- name: Antigravity IDE | Create the menu entry
  ansible.builtin.copy:
    dest: "{{ user_home }}/.local/share/applications/antigravity.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Antigravity
      Comment=Agentic development platform
      Exec={{ antigravity_ide_dir }}/antigravity %U
      Icon={{ user_home }}/.local/share/icons/hicolor/512x512/apps/antigravity.png
      Terminal=false
      Categories=Development;IDE;
      MimeType=x-scheme-handler/antigravity;
      StartupWMClass=antigravity
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0644'
  when: user_name != 'root' and (antigravity_ide_bin.stat.exists | default(false) or antigravity_ide_download | default({}) is changed)
  tags: [software, shortcuts, antigravity]

- name: Shortcuts | Update desktop database
  ansible.builtin.command:
    cmd: "update-desktop-database {{ user_home }}/.local/share/applications/"
  become_user: "{{ user_name }}"
  changed_when: false
  when: user_name != 'root'
  tags: [software, shortcuts, steam, gpu, antigravity]

# --- Flatpak overrides and cedilla fixes ---
# Bitwarden runs on native Wayland (the Flatpak wrapper picks the display mode from the granted
# sockets); the cedilla works there without GTK_IM_MODULE. X11 stays only as a fallback.
- name: Wayland | Apply Flatpak overrides for Bitwarden (KDE)
  ansible.builtin.command:
    cmd: "flatpak override --user --socket=wayland --socket=fallback-x11 --nosocket=x11 --unset-env=GTK_IM_MODULE --env=XDG_CURRENT_DESKTOP=KDE --env=GTK_USE_PORTAL=1 com.bitwarden.desktop"
  become_user: "{{ user_name }}"
  register: bitwarden_override_kde
  failed_when: false
  changed_when: false
  when: is_kde and user_name != 'root'
  tags: [desktop, cedilla, flatpak]

# Zoom hardcodes QT_QPA_PLATFORM=xcb, so it always runs on XWayland; the cedilla works there
# through ~/.XCompose without the IM modules (--unset-env only cleans up older overrides).
- name: Zoom | Apply Flatpak overrides (KDE)
  ansible.builtin.command:
    cmd: "flatpak override --user --socket=wayland --unset-env=GTK_IM_MODULE --unset-env=QT_IM_MODULE --env=XDG_CURRENT_DESKTOP=KDE --env=GTK_USE_PORTAL=1 --nofilesystem=home us.zoom.Zoom"
  become_user: "{{ user_name }}"
  register: zoom_override
  failed_when: false
  changed_when: false
  when: is_kde and user_name != 'root'
  tags: [desktop, zoom, cedilla, flatpak]
