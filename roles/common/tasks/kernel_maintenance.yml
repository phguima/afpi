---
# Kernel maintenance tasks: cleanup old kernels and debug packages

- name: Kernel | Prevent removal of debug packages if running debug kernel
  ansible.builtin.fail:
    msg: "You are currently running a DEBUG kernel ({{ ansible_facts['kernel'] }}). Please boot into a normal kernel before proceeding."
  when: "'debug' in ansible_facts['kernel']"
  tags: [system, kernel]

- name: Kernel | Get list of installed debug kernels
  ansible.builtin.shell: dnf repoquery --installed "kernel*debug*" -q
  register: installed_debug_kernels
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [system, kernel]

- name: Kernel | Remove kernel debug packages
  ansible.builtin.dnf:
    name: "{{ installed_debug_kernels.stdout_lines }}"
    state: absent
  when: installed_debug_kernels.stdout_lines | length > 0
  tags: [system, kernel]

# Only touch the debug repos that are actually enabled, so the task reports "changed" for real.
# community.general.dnf_config_manager is not used: it speaks the dnf4 syntax (--set-disabled).
- name: Kernel | Get enabled repositories
  ansible.builtin.command: dnf repo list --enabled --json
  register: enabled_repos
  changed_when: false
  check_mode: false
  tags: [system, kernel]

- name: Kernel | Disable debug repositories
  ansible.builtin.command:
    argv: "{{ ['dnf', 'config-manager', 'setopt'] + (enabled_debug_repos | map('regex_replace', '$', '.enabled=0') | list) }}"
  vars:
    enabled_debug_repos: "{{ enabled_repos.stdout | from_json | map(attribute='id') | select('search', 'debug') | list }}"
  when: enabled_debug_repos | length > 0
  tags: [system, kernel]

- name: Kernel | Get list of old kernels
  ansible.builtin.shell: |
    dnf repoquery --installonly --latest-limit=-1 -q | grep -v $(uname -r)
  register: old_kernels_list
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [system, kernel]

# allowerasing also removes what is bound to those exact kernels: the kmod-<name>-<kernel> packages
# akmods built for them (VirtualBox, NVIDIA). Without it dnf refuses with a depsolve error, since
# each kmod requires its own kernel-uname-r. The running and the newest kernel are never listed.
- name: Kernel | Remove old kernels
  ansible.builtin.dnf:
    name: "{{ old_kernels_list.stdout_lines }}"
    state: absent
    allowerasing: true
  when: 
    - old_kernels_list.stdout_lines | length > 0
    - not ansible_check_mode
  tags: [system, kernel]
