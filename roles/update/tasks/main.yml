---
# Tasks for 'update' role

# --- DNF optimization & RPM Fusion ---
# dnf5-plugins provides 'dnf needs-restarting' (used by the reboot gate below);
# dnf-plugins-core is the dnf4 counterpart.
- name: DNF | Install DNF plugins
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
      - dnf5-plugins
    state: present
  tags: [update]

- name: System | Optimize DNF Configuration
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "max_parallel_downloads", value: "{{ dnf_max_parallel_downloads }}" }
    - { key: "fastestmirror", value: "{{ dnf_fastestmirror }}" }
  tags: [update]

- name: System | Add RPM Fusion repositories
  ansible.builtin.dnf:
    name:
      - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
      - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
    state: present
    disable_gpg_check: yes
  tags: [update]

- name: System | Upgrade all packages and refresh dnf cache
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  become: true
  tags: [update]

# --- Reboot gate ---
# If the upgrade touched the kernel or core libraries, stop here: the rest of the playbook must
# run on the new kernel (the NVIDIA and VirtualBox akmods build against the running kernel, and
# kernel cleanup can only drop the old one once it is no longer running).
- name: System | Check whether a reboot is required
  ansible.builtin.command: dnf needs-restarting -r
  register: reboot_hint
  changed_when: false
  failed_when: reboot_hint.rc not in [0, 1]
  check_mode: false
  tags: [update]

# needs-restarting compares install times with the boot time that systemd reports, which is wrong
# when the RTC keeps local time (dual boot with Windows): on noir it put the boot after the kernel
# upgrade and returned 0. Comparing the running kernel with the newest installed one needs no clock.
- name: System | Find the newest installed kernel
  ansible.builtin.shell: rpm -qa kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -n 1
  register: newest_kernel
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [update]

- name: System | Stop until the system is rebooted
  when: >-
    reboot_hint.rc == 1 or
    (newest_kernel.stdout | length > 0 and newest_kernel.stdout != ansible_facts['kernel'])
  tags: [update]
  block:
    - name: System | Ask for a reboot
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "The system was updated and needs a REBOOT before continuing."
          - "Reboot, then run the same ansible-playbook command again:"
          - "the update step will pass and the rest of the setup will run."
          - "=================================================================="

    - name: System | End the play for this host
      ansible.builtin.meta: end_host