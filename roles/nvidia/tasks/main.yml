---
# NVIDIA proprietary driver installation (signed)

- name: NVIDIA | Check if NVIDIA GPU is present
  set_fact:
    is_nvidia_present: "{{ is_nvidia | default(false) }}"
  tags: [nvidia, hardware]

- name: NVIDIA | Check if NVIDIA drivers are already installed
  ansible.builtin.command: nvidia-smi
  register: nvidia_installed_check
  failed_when: false
  changed_when: false
  tags: [nvidia, hardware]

- name: NVIDIA | Driver Installation Block
  block:
    - name: NVIDIA | Ensure RPM Fusion Non-Free is enabled
      ansible.builtin.dnf:
        name: 
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
        state: present
        disable_gpg_check: yes

    - name: NVIDIA | Install prerequisites
      ansible.builtin.dnf:
        name: "{{ nvidia_prerequisite_packages }}"
        state: present

    # Secure Boot: the akmods key pair must exist BEFORE the driver install, because akmods signs
    # the modules it builds with it. The enrollment itself is confirmed by hand in MokManager on reboot.
    - name: NVIDIA | Prepare module signing key (Secure Boot)
      when: is_secure_boot
      block:
        # No --force: that creates a brand-new pair on every run and repoints the symlinks to it,
        # leaving the already-enrolled key unused.
        - name: NVIDIA | Generate akmods signing key pair
          ansible.builtin.command:
            cmd: kmodgenca -a
            creates: /etc/pki/akmods/certs/public_key.der

        # "is already enrolled" / "is already in the enrollment request" -> nothing to do
        - name: NVIDIA | Check MOK enrollment state
          ansible.builtin.command: mokutil --test-key /etc/pki/akmods/certs/public_key.der
          register: nvidia_mok_state
          changed_when: false
          failed_when: false
          check_mode: false

        - name: NVIDIA | Request MOK enrollment
          ansible.builtin.command:
            cmd: mokutil --import /etc/pki/akmods/certs/public_key.der
            stdin: "{{ mok_password | default('fedora-afpi') }}\n{{ mok_password | default('fedora-afpi') }}"
          when: "'already' not in nvidia_mok_state.stdout"
          register: nvidia_mok_import
          no_log: true

    - name: NVIDIA | Install NVIDIA drivers and related packages
      ansible.builtin.dnf:
        name: "{{ nvidia_driver_packages }}"
        state: present

    - name: NVIDIA | Wait for kernel modules (akmods) to build
      ansible.builtin.shell: |
        while pgrep -x "akmods" > /dev/null || pgrep -x "rpmbuild" > /dev/null; do
          sleep 5
        done
      async: 1200
      poll: 10
      changed_when: false

    - name: NVIDIA | Force akmods to rebuild and sign modules
      ansible.builtin.shell: |
        akmods --force --kernel $(uname -r) --akmod nvidia
      register: akmods_force_result
      changed_when: true
      failed_when: false

    - name: NVIDIA | Update initramfs (dracut)
      ansible.builtin.shell: dracut --force
      when: akmods_force_result.rc == 0
      changed_when: true
      failed_when: false

    - name: NVIDIA | Recommend Reboot
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "A system REBOOT is REQUIRED to load the NVIDIA driver."
          - "=================================================="

    - name: NVIDIA | Remind to enroll the MOK key on next boot
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "Secure Boot: akmods signing key queued for enrollment."
          - "REBOOT, choose 'Enroll MOK' in the blue MokManager screen and"
          - "type the MOK password. The NVIDIA modules load after that."
          - "=================================================================="
      when: nvidia_mok_import is changed
  when: 
    - is_nvidia_present
    - nvidia_installed_check.rc != 0
  tags: [nvidia]
